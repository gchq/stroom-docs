ont-style="italic" lengthAdjust="spacing" textLength="110.1074" x="369.3654" y="796.0917">userinfo endpoint</text><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="81.4941" x="340.1723" y="810.6425">access token</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg10"><polygon fill="#2196F3" points="333.9223,871.8913,323.5057,876.0579,333.9223,880.2246,329.7557,876.0579" style="stroke:#2196F3;stroke-width:1.0417;"/><line style="stroke:#2196F3;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="327.6723" x2="542.396" y1="876.0579" y2="876.0579"/><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="72.6318" x="350.589" y="860.6099">User claims</text></g><path d="M327.0833,893.7663 L327.0833,973.9746 A4.1667,4.1667 0 0 0 331.25,978.1413 L558.3333,978.1413 A4.1667,4.1667 0 0 0 562.5,973.9746 L562.5,900.0163 L552.0833,889.5996 L331.25,889.5996 A4.1667,4.1667 0 0 0 327.0833,893.7663" fill="url(#g1grvgxhqkofuk2)" filter="url(#f1grvgxhqkofuk)" style="stroke:#9C27B0;stroke-width:1.0417;"/><path d="M552.0833,889.5996 L552.0833,897.9329 A2.0833,2.0833 0 0 0 554.1667,900.0163 L562.5,900.0163 L552.0833,889.5996" fill="url(#g1grvgxhqkofuk2)" style="stroke:#9C27B0;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="174.4446" x="343.75" y="916.8274">The ALB signs these claims,</text><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="164.6484" x="343.75" y="931.3782">and discards the ID token.</text><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="151.9409" x="343.75" y="945.929">Only claims the userinfo</text><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="193.3044" x="343.75" y="960.4797">endpoint returns reach Stroom</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg11"><polygon fill="#2196F3" points="70.6451,1039.4043,60.2285,1043.571,70.6451,1047.7376,66.4785,1043.571" style="stroke:#2196F3;stroke-width:1.0417;"/><line style="stroke:#2196F3;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="64.3951" x2="321.4223" y1="1043.571" y2="1043.571"/><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="217.4438" x="87.3118" y="1013.5722">Sets AWSELBAuthSessionCookie-*,</text><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="150.7568" x="87.3118" y="1028.123">302 to the original page</text></g><rect fill="url(#g1grvgxhqkofuk1)" filter="url(#f1grvgxhqkofuk)" height="3.125" rx="4.1667" ry="4.1667" style="stroke:url(#g1grvgxhqkofuk1);stroke-width:1.0417;" width="1042.4103" x="10.4167" y="1083.138"/><line style="stroke:#666666;stroke-width:1.0417;" x1="10.4167" x2="1052.8269" y1="1083.138" y2="1083.138"/><line style="stroke:#666666;stroke-width:1.0417;" x1="10.4167" x2="1052.8269" y1="1086.263" y2="1086.263"/><rect fill="url(#g1grvgxhqkofuk1)" filter="url(#f1grvgxhqkofuk)" height="43.7174" rx="4.1667" ry="4.1667" style="stroke:#666666;stroke-width:2.0833;" width="277.2685" x="392.9876" y="1062.321"/><text fill="#222222" font-family="'Verdana'" font-size="12.5" font-weight="bold" lengthAdjust="spacing" textLength="237.5" x="409.6542" y="1088.5071">Stroom verifies, on every request</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg12"><polygon fill="#2196F3" points="309.964,1153.9225,320.3807,1158.0892,309.964,1162.2559,314.1307,1158.0892" style="stroke:#2196F3;stroke-width:1.0417;"/><line style="stroke:#2196F3;stroke-width:3.125;" x1="59.1868" x2="316.214" y1="1158.0892" y2="1158.0892"/><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="137.9456" x="76.8951" y="1142.6412">GET / (session cookie)</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg13"><polygon fill="#2196F3" points="738.0707,1218.4408,748.4873,1222.6074,738.0707,1226.7741,742.2373,1222.6074" style="stroke:#2196F3;stroke-width:1.0417;"/><line style="stroke:#2196F3;stroke-width:3.125;" x1="322.464" x2="744.3207" y1="1222.6074" y2="1222.6074"/><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="33.4045" x="340.1723" y="1192.6086">GET /</text><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="230.78" x="340.1723" y="1207.1594">x-amzn-oidc-data: signed claims JWT</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg14"><line style="stroke:#2196F3;stroke-width:3.125;" x1="750.5707" x2="794.3207" y1="1316.2272" y2="1316.2272"/><line style="stroke:#2196F3;stroke-width:3.125;" x1="794.3207" x2="794.3207" y1="1316.2272" y2="1329.7689"/><line style="stroke:#2196F3;stroke-width:3.125;" x1="751.6123" x2="794.3207" y1="1329.7689" y2="1329.7689"/><polygon fill="#2196F3" points="762.029,1325.6022,751.6123,1329.7689,762.029,1333.9355,757.8623,1329.7689" style="stroke:#2196F3;stroke-width:1.0417;"/><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="198.7915" x="768.279" y="1257.1269">Verify the signature against the</text><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="172.7112" x="768.279" y="1271.6777">regional AWS key (cached),</text><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="151.9287" x="768.279" y="1286.2284">check signer and issuer,</text><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="266.8396" x="768.279" y="1300.7792">map uniqueIdentityClaim to a Stroom user</text></g><path d="M755.2083,1347.4772 L755.2083,1442.2689 A4.1667,4.1667 0 0 0 759.375,1446.4355 L1009.375,1446.4355 A4.1667,4.1667 0 0 0 1013.5417,1442.2689 L1013.5417,1353.7272 L1003.125,1343.3105 L759.375,1343.3105 A4.1667,4.1667 0 0 0 755.2083,1347.4772" fill="url(#g1grvgxhqkofuk2)" filter="url(#f1grvgxhqkofuk)" style="stroke:#9C27B0;stroke-width:1.0417;"/><path d="M1003.125,1343.3105 L1003.125,1351.6439 A2.0833,2.0833 0 0 0 1005.2083,1353.7272 L1013.5417,1353.7272 L1003.125,1343.3105" fill="url(#g1grvgxhqkofuk2)" style="stroke:#9C27B0;stroke-width:1.0417;"/><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="186.6821" x="771.875" y="1370.5383">The identity is never held in a</text><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="194.7571" x="771.875" y="1385.0891">Stroom session. It is re-derived</text><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="216.4307" x="771.875" y="1399.6399">from the header on every request,</text><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="183.8318" x="771.875" y="1414.1907">which is how the proxy's own</text><text fill="#FFFFFF" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="186.7493" x="771.875" y="1428.7415">token refresh reaches Stroom</text><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg15"><polygon fill="#2196F3" points="333.9223,1493.1152,323.5057,1497.2819,333.9223,1501.4486,329.7557,1497.2819" style="stroke:#2196F3;stroke-width:1.0417;"/><line style="stroke:#2196F3;stroke-width:3.125;stroke-dasharray:2.0833,2.0833;" x1="327.6723" x2="749.529" y1="1497.2819" y2="1497.2819"/><text fill="#222222" font-family="'Verdana'" font-size="12.5" lengthAdjust="spacing" textLength="60.5957" x="350.589" y="1481.8339">Response</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg16"><polygon fill="#2196F3" points="70.6451,1543.0827,60.2285,1547.2493,70.6451,1551.416,66.4785,1547.2493" style="stroke:#2196F3;stroke-wi