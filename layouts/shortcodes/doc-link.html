{{- /*
Generates a link to the reference documentation for the given document type.
It uses the data in data/doc-reference/<docType>.json, generated by
stroom.app.docs.GenerateDocumentReferenceDoc.

The hover tooltip content is rendered into an inert <template> so that the
description can contain block elements without breaking the surrounding page.

Usage: {{< doc-link "KafkaConfig" >}}   (use {{< >}}, not {{% %}})
*/ -}}
{{- if ne (len .Params) 1 -}}
  {{- errorf "The %q shortcode requires one positional argument, the document type. See %s" .Name .Position -}}
{{- end -}}

{{- $docType := .Get 0 -}}
{{- $file := printf "data/doc-reference/%s.json" $docType -}}
{{- with resources.Get $file -}}
  {{- with . | transform.Unmarshal -}}
    {{- $document := . -}}
    {{- $displayName := .typeDisplayName -}}
    {{- $target := printf "docs/reference-section/documents#%s" (anchorize $displayName) -}}
    <span class="doc-link link-with-hover-tooltip">
      <a href="{{ relref $.Page $target }}">
        <span class="doc-link-icon">
          {{- partial "stroom-icon.partial.html" (dict
              "context" $
              "file" .iconRelativePathStr
              "title" $displayName
              "enabled" "enabled"
              "colour" "" ) -}}
        </span>
        <span class="doc-link-text">{{ $displayName }}</span>
      </a>
      {{- with .description -}}
        <template class="doc-link-tooltip hover-tooltip-content">
          <span class="hover-tooltip-type">Stroom Document</span>
          <span class="hover-tooltip-title">
            {{- partial "stroom-icon.partial.html" (dict
                "context" $
                "file" $document.iconRelativePathStr
                "title" $document.typeDisplayName
                "enabled" "enabled"
                "colour" "" ) -}}
            {{- $document.typeDisplayName -}}
          </span>
          <div class="hover-tooltip-summary">{{- . | markdownify -}}</div>
          <span class="hover-tooltip-more-details">Click to see more details...</span>
        </template>
      {{- end -}}
    </span>
  {{- end -}}
{{- else -}}
  {{- errorf "The %q shortcode was unable to find %s. See %s" $.Name $file $.Position -}}
{{- end -}}
